openapi: 3.1.0
info:
  title: Matrículas API
  description: "\nAPI REST del sistema de **Matrículas** del Centro de Formación Técnica\
    \ AprendeMás.\n\nPermite gestionar estudiantes y sus matrículas. Antes de confirmar\
    \ una\nmatrícula, valida en tiempo real la disponibilidad de cupos consultando\n\
    al servicio **Cupos** a través de gRPC (contrato: `proto/cupos.proto`).\n\n###\
    \ Autenticación\nTodos los endpoints de negocio requieren la cabecera `X-API-Key`.\
    \ Hay dos tipos de clave:\n\n* **Administrador** (variable `API_KEYS`): acceso\
    \ total. Es la única que puede crear y\n  listar estudiantes y emitir o revocar\
    \ claves de estudiante.\n* **Estudiante** (emitida a demanda con `POST /v1/students/{id}/api-key`):\
    \ solo permite\n  operar sobre los datos de ese estudiante (su ficha y sus matrículas).\
    \ Con otra\n  persona responde `403`; las matrículas ajenas responden `404`.\n\
    \nVer la sección \"Autenticación\" del README. Los intentos de autenticación fallidos\
    \ se limitan\npor IP (`429` + `Retry-After`) y un estudiante con clave propia\
    \ tiene un tope de escrituras por minuto.\n\n### Cursos y disponibilidad\n`GET\
    \ /v1/courses` y `GET /v1/courses/{curso_id}` informan los cupos libres (dato\
    \ **referencial**,\ncon caché de unos segundos). Quien decide si hay cupo es siempre\
    \ `POST /v1/enrollments`.\n\n### Errores\nTodas las respuestas de error usan el\
    \ mismo formato JSON:\n\n```json\n{\"error\": {\"code\": \"SIN_CUPOS\", \"message\"\
    : \"...\", \"details\": null}}\n```\n\n### Idempotencia\n`POST /v1/enrollments`\
    \ acepta la cabecera `Idempotency-Key`. Reintentar con la\nmisma clave devuelve\
    \ la misma matrícula y nunca consume un segundo cupo.\n\n### Disponibilidad de\
    \ Cupos\nLos endpoints que dependen de Cupos (`POST /v1/enrollments`,\n`POST /v1/enrollments/{id}/revert`)\
    \ distinguen tres fallas de la dependencia:\n\n* `504 Gateway Timeout`: Cupos\
    \ no respondió a tiempo. El resultado es\n  **incierto**; la matrícula queda `PENDIENTE`\
    \ y se concilia (ver más abajo).\n* `503 Service Unavailable`: Cupos caído o circuito\
    \ abierto (falla rápida). Si la conexión\n  se rechazó (la solicitud nunca salió)\
    \ no queda nada pendiente y se puede reintentar con\n  una Idempotency-Key nueva\
    \ o la misma. Incluye `Retry-After`.\n* `502 Bad Gateway`: Cupos respondió con\
    \ un error interno inesperado. Por precaución la\n  matrícula también queda `PENDIENTE`\
    \ y se concilia.\n\nUna matrícula `PENDIENTE` se resuelve reintentando con la\
    \ misma\n`Idempotency-Key` (dentro de la ventana de reintento) o, si no se reintenta,\
    \ el\nconciliador la anula y libera el cupo. La lectura de datos ya existentes\n\
    (estudiantes y matrículas) no se ve afectada por una caída de Cupos.\n"
  version: 1.1.0
paths:
  /v1/health:
    get:
      tags:
      - Salud
      summary: Estado del servicio y de su dependencia con Cupos
      description: 'No requiere autenticación (usado por orquestadores/health checks).
        Informa el estado del circuit breaker hacia Cupos para observabilidad: ''CLOSED''
        operando normal, ''OPEN'' fallando rápido porque Cupos no responde, ''HALF_OPEN''
        probando si Cupos ya se recuperó.'
      operationId: health_v1_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
  /v1/students:
    post:
      tags:
      - Estudiantes
      summary: Crear un estudiante (solo administrador)
      operationId: crear_estudiante_v1_students_post
      parameters:
      - name: X-API-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StudentCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentOut'
        '401':
          description: Falta la API key o es inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Requiere API key de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: RUT o email ya registrados
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Datos inválidos (p. ej. RUT con dígito verificador incorrecto)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - ApiKeyAuth: []
    get:
      tags:
      - Estudiantes
      summary: Listar estudiantes (solo administrador)
      operationId: listar_estudiantes_v1_students_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          maximum: 100000
          minimum: 0
          default: 0
          title: Offset
      - name: rut
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: Filtrar por RUT exacto
          title: Rut
        description: Filtrar por RUT exacto
      - name: X-API-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentPage'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '403':
          description: Requiere API key de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - ApiKeyAuth: []
  /v1/students/{student_id}:
    get:
      tags:
      - Estudiantes
      summary: Consultar un estudiante por id
      description: Un administrador puede consultar a cualquiera; un estudiante solo
        a sí mismo.
      operationId: obtener_estudiante_v1_students__student_id__get
      parameters:
      - name: student_id
        in: path
        required: true
        schema:
          type: string
          title: Student Id
      - name: X-API-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StudentOut'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '403':
          description: El estudiante intenta ver a otro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - ApiKeyAuth: []
    delete:
      tags:
      - Estudiantes
      summary: 'Anonimizar a un estudiante: derecho de supresión (solo administrador)'
      description: 'Elimina los datos personales del estudiante (RUT, nombre, apellido,
        correo, teléfono) reemplazándolos por valores anónimos, revoca su API key
        y conserva sus matrículas como historial **sin datos personales** (no se borran
        para no romper el registro de cupos). Es idempotente: repetirla devuelve 204.
        No se puede deshacer.'
      operationId: anonimizar_estudiante_v1_students__student_id__delete
      parameters:
      - name: student_id
        in: path
        required: true
        schema:
          type: string
          title: Student Id
      - name: X-API-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '204':
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '403':
          description: Requiere API key de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El estudiante no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - ApiKeyAuth: []
  /v1/students/{student_id}/api-key:
    post:
      tags:
      - Estudiantes
      summary: Emitir la API key personal de un estudiante (solo administrador)
      description: 'Crea la API key del estudiante. Con ella (cabecera `X-API-Key`)
        el estudiante puede operar **solo sobre sus propios datos**: consultar su
        ficha y matricularse, revertir y consultar sus matrículas. El valor completo
        se devuelve **una única vez**; en la base solo queda su hash. Hay una clave
        activa por estudiante: para rotarla, primero revócala (`DELETE`) y emite otra.'
      operationId: emitir_api_key_v1_students__student_id__api_key_post
      parameters:
      - name: student_id
        in: path
        required: true
        schema:
          type: string
          title: Student Id
      - name: X-API-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyIssued'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '403':
          description: Requiere API key de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El estudiante no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: El estudiante ya tiene una clave activa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - ApiKeyAuth: []
    get:
      tags:
      - Estudiantes
      summary: Consultar los metadatos de la API key activa de un estudiante
      description: Nunca devuelve el secreto. Un administrador ve la de cualquiera;
        un estudiante, la suya.
      operationId: consultar_api_key_v1_students__student_id__api_key_get
      parameters:
      - name: student_id
        in: path
        required: true
        schema:
          type: string
          title: Student Id
      - name: X-API-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyInfo'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Forbidden
        '404':
          description: El estudiante no existe o no tiene clave activa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - ApiKeyAuth: []
    delete:
      tags:
      - Estudiantes
      summary: Revocar la API key activa de un estudiante (solo administrador)
      operationId: revocar_api_key_v1_students__student_id__api_key_delete
      parameters:
      - name: student_id
        in: path
        required: true
        schema:
          type: string
          title: Student Id
      - name: X-API-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '204':
          description: Successful Response
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '403':
          description: Requiere API key de administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El estudiante no existe o no tiene clave activa
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - ApiKeyAuth: []
  /v1/courses:
    get:
      tags:
      - Cursos
      summary: Listar cursos con su disponibilidad (referencial)
      description: 'Cursos de Cupos con `cupos_libres`. Con `disponibles=true` solo
        los que tienen cupos. El dato puede tener hasta `CURSOS_CACHE_TTL_SECONDS`
        segundos de antigüedad: para reservar, usa `POST /v1/enrollments`.'
      operationId: listar_cursos_v1_courses_get
      parameters:
      - name: disponibles
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Disponibles
      - name: X-API-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseList'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '503':
          description: Cupos no disponible (caído o circuito abierto)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Cupos no respondió a tiempo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Cupos devolvió un error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - ApiKeyAuth: []
  /v1/courses/{curso_id}:
    get:
      tags:
      - Cursos
      summary: Consultar un curso y su disponibilidad (referencial)
      operationId: obtener_curso_v1_courses__curso_id__get
      parameters:
      - name: curso_id
        in: path
        required: true
        schema:
          type: integer
          title: Curso Id
      - name: X-API-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CourseOut'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '503':
          description: Cupos no disponible (caído o circuito abierto)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Cupos no respondió a tiempo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Cupos devolvió un error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El curso no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - ApiKeyAuth: []
  /v1/enrollments:
    post:
      tags:
      - Matrículas
      summary: Matricular a un estudiante en un curso
      description: 'Registra la matrícula solo si el curso tiene cupos disponibles
        según el servicio de Cupos (verificado en tiempo real vía gRPC; consulta y
        reserva son una sola llamada atómica).


        **Idempotencia.** Envía una cabecera `Idempotency-Key` (p. ej. un UUID) para
        poder reintentar con seguridad: repetir la solicitud con la misma clave devuelve
        la misma matrícula (cabecera `Idempotent-Replayed: true`) y nunca consume
        un segundo cupo. Una clave identifica un intento **de ese estudiante**; reutilizarla
        con otro curso da 422. Repetir la clave de una matrícula ya anulada da 409
        `ENROLLMENT_ANNULLED`.


        **Resultado incierto (504).** Si Cupos no responde a tiempo, el cupo pudo
        haberse ocupado. La matrícula queda `PENDIENTE`: reintenta con la misma clave
        o consulta `GET /v1/enrollments/{id}`. Si no se confirma dentro del TTL, se
        anula automáticamente y se libera el cupo.'
      operationId: matricular_v1_enrollments_post
      parameters:
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 128
          - type: 'null'
          description: Identifica este intento para poder reintentarlo sin duplicar
            el cupo.
          title: Idempotency-Key
        description: Identifica este intento para poder reintentarlo sin duplicar
          el cupo.
      - name: X-API-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentOut'
        '401':
          description: Falta la API key o es inválida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Una API key de estudiante solo puede matricular a su propio
            estudiante
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Estudiante o curso no existen
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Ya matriculado, matrícula en proceso, anulada o sin cupos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Datos inválidos o Idempotency-Key reutilizada con otro curso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Demasiadas operaciones por minuto (clave de estudiante)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          description: Cupos devolvió un error interno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Cupos no disponible (caído o circuito abierto)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: 'Cupos no respondió a tiempo: resultado incierto, matrícula
            PENDIENTE'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - ApiKeyAuth: []
    get:
      tags:
      - Matrículas
      summary: Listar matrículas
      description: Un administrador ve todas (con filtros opcionales). Con una API
        key de estudiante solo se listan sus propias matrículas.
      operationId: listar_matriculas_v1_enrollments_get
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          maximum: 100000
          minimum: 0
          default: 0
          title: Offset
      - name: student_id
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Student Id
      - name: curso_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Curso Id
      - name: estado
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/EstadoMatricula'
          - type: 'null'
          title: Estado
      - name: X-API-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentPage'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '403':
          description: Un estudiante filtró por el student_id de otro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - ApiKeyAuth: []
  /v1/enrollments/{enrollment_id}/revert:
    post:
      tags:
      - Matrículas
      summary: Revertir (anular) una matrícula y liberar el cupo
      operationId: revertir_matricula_v1_enrollments__enrollment_id__revert_post
      parameters:
      - name: enrollment_id
        in: path
        required: true
        schema:
          type: string
          title: Enrollment Id
      - name: X-API-Key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Api-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentOut'
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Unauthorized
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Not Found
        '409':
          description: La matrícula ya estaba anulada o aún está pendiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          description: Demasiadas operaciones por minuto (clave de estudiante)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: El cupo se liberó pero no se pudo guardar; repetir
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '502':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: Bad Gateway
        '503':
          description: Cupos no disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '504':
          description: Cupos no respondió a tiempo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
