services:
  cupos:
    build:
      context: .                    # raíz del servicio cupos
      dockerfile: cupos/Dockerfile
    environment:
      DB_PATH: /data/cupos.db
      SIMULAR_LATENCIA_MS: ${SIMULAR_LATENCIA_MS:-0}  # latencia artificial para pruebas
    volumes:
      - cupos_data:/data            # BD propia del servicio (T5)
    expose:
      - "50051"                     # no publicar al exterior
    ports:
      - "50051:50051"               # para pruebas locales

  matriculas-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${MATRICULAS_DB_NAME:-matriculas_db}
      POSTGRES_USER: ${MATRICULAS_DB_USER:-matriculas_user}
      POSTGRES_PASSWORD: ${MATRICULAS_DB_PASSWORD:-matriculas_pass}
    volumes:
      - matriculas_db_data:/var/lib/postgresql/data   # BD propia del servicio (T5), igual que cupos_data
    expose:
      - "5432"                      # solo visible para otros servicios del compose
    ports:
      - "5432:5432"                 # para pruebas locales (psql, etc.) - quitar en un despliegue real
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MATRICULAS_DB_USER:-matriculas_user} -d ${MATRICULAS_DB_NAME:-matriculas_db}"]
      interval: 5s
      timeout: 5s
      retries: 10

  matriculas:
    build:
      context: .                    # raíz del monorepo, igual que cupos
      dockerfile: matriculas/Dockerfile
    restart: "no"                   # no es un servidor: corre una vez y termina (ver README)
    stdin_open: true                # necesario: matriculas es un CLI interactivo
    tty: true
    environment:
      DB_HOST: matriculas-db
      DB_PORT: 5432
      DB_NAME: ${MATRICULAS_DB_NAME:-matriculas_db}
      DB_USER: ${MATRICULAS_DB_USER:-matriculas_user}
      DB_PASSWORD: ${MATRICULAS_DB_PASSWORD:-matriculas_pass}
    depends_on:
      matriculas-db:
        condition: service_healthy
    profiles: ["legacy"]            # CLI "antes de la integración" (ver README) - no se levanta por defecto

  # API REST pública de Matrículas (Python/FastAPI). Valida disponibilidad
  # de cupos contra `cupos` vía gRPC antes de confirmar cada matrícula.
  matriculas-api:
    build:
      context: .                    # raíz del monorepo, igual que los demás (necesita proto/)
      dockerfile: matriculas-api/Dockerfile
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg2://${MATRICULAS_DB_USER:-matriculas_user}:${MATRICULAS_DB_PASSWORD:-matriculas_pass}@matriculas-db:5432/${MATRICULAS_DB_NAME:-matriculas_db}
      CUPOS_GRPC_TARGET: cupos:50051
      CUPOS_GRPC_TIMEOUT_SECONDS: ${CUPOS_GRPC_TIMEOUT_SECONDS:-2.0}
      CUPOS_CB_FAILURE_THRESHOLD: ${CUPOS_CB_FAILURE_THRESHOLD:-5}
      CUPOS_CB_RECOVERY_SECONDS: ${CUPOS_CB_RECOVERY_SECONDS:-15.0}
      API_KEYS: ${MATRICULAS_API_KEYS:-dev-matriculas-key-123}
    ports:
      - "8000:8000"                 # API pública
    depends_on:
      matriculas-db:
        condition: service_healthy
      cupos:
        condition: service_started

volumes:
  cupos_data:
  matriculas_db_data:
